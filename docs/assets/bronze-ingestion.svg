<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="645" viewBox="0 0 1200 645" role="img" aria-labelledby="title desc">
<title id="title">Bronze ingestion and safe reruns</title><desc id="desc">New files are staged and published. Identical files are skipped or have metadata repaired. Changed input is rejected unless overwrite is explicitly requested.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#5eead4"/></marker></defs>
<rect width="1200" height="645" rx="22" fill="#0b1220"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="48" fill="#f1f5f9" font-size="24" font-weight="650">BRONZE / WHAT HAPPENS WHEN YOU INGEST A FILE?</text><text x="40" y="80" fill="#a9bbcf" font-size="18" font-weight="400">Idempotency means repeating the same input produces the same stored result.</text><rect x="40" y="120" width="310" height="170" rx="16" fill="#142237" stroke="#30445f"/><rect x="60" y="142" width="30" height="4" rx="2" fill="#5eead4"/><text x="60" y="179" fill="#f1f5f9" font-size="23" font-weight="650">1. Read the source</text><text x="60" y="212" fill="#a9bbcf" font-size="17" font-weight="400">Generated files in data/raw</text><text x="60" y="239" fill="#a9bbcf" font-size="17" font-weight="400">Calculate a SHA-256 fingerprint</text><rect x="440" y="120" width="310" height="170" rx="16" fill="#142237" stroke="#30445f"/><rect x="460" y="142" width="30" height="4" rx="2" fill="#7db5ff"/><text x="460" y="179" fill="#f1f5f9" font-size="23" font-weight="650">2. Check destination</text><text x="460" y="212" fill="#a9bbcf" font-size="17" font-weight="400">Select source + date partition</text><text x="460" y="239" fill="#a9bbcf" font-size="17" font-weight="400">Compare actual file contents</text><rect x="840" y="120" width="320" height="170" rx="16" fill="#142237" stroke="#30445f"/><rect x="860" y="142" width="30" height="4" rx="2" fill="#c4a5ff"/><text x="860" y="179" fill="#f1f5f9" font-size="23" font-weight="650">3. Decide safely</text><text x="860" y="212" fill="#a9bbcf" font-size="17" font-weight="400">New, identical, or conflicting?</text><text x="860" y="239" fill="#a9bbcf" font-size="17" font-weight="400">Choose the matching action</text><path d="M350,200 L440,200" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><path d="M750,200 L840,200" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="355" width="320" height="205" rx="16" fill="#142237" stroke="#30445f"/><rect x="60" y="377" width="30" height="4" rx="2" fill="#5eead4"/><text x="60" y="414" fill="#f1f5f9" font-size="23" font-weight="650">New file: land</text><text x="60" y="447" fill="#a9bbcf" font-size="17" font-weight="400">Copy to a temporary file</text><text x="60" y="474" fill="#a9bbcf" font-size="17" font-weight="400">Verify and publish complete data</text><text x="60" y="501" fill="#a9bbcf" font-size="17" font-weight="400">Write the metadata sidecar</text><rect x="440" y="355" width="320" height="205" rx="16" fill="#142237" stroke="#30445f"/><rect x="460" y="377" width="30" height="4" rx="2" fill="#7db5ff"/><text x="460" y="414" fill="#f1f5f9" font-size="23" font-weight="650">Identical file: skip</text><text x="460" y="447" fill="#a9bbcf" font-size="17" font-weight="400">Keep existing data and metadata</text><text x="460" y="474" fill="#a9bbcf" font-size="17" font-weight="400">Preserve the ingestion timestamp</text><text x="460" y="501" fill="#a9bbcf" font-size="17" font-weight="400">Repair missing / invalid metadata</text><rect x="840" y="355" width="320" height="205" rx="16" fill="#142237" stroke="#30445f"/><rect x="860" y="377" width="30" height="4" rx="2" fill="#fbbf77"/><text x="860" y="414" fill="#f1f5f9" font-size="23" font-weight="650">Changed file: reject</text><text x="860" y="447" fill="#a9bbcf" font-size="17" font-weight="400">Protect the existing partition</text><text x="860" y="474" fill="#a9bbcf" font-size="17" font-weight="400">Use a new date for a new snapshot</text><text x="860" y="501" fill="#a9bbcf" font-size="17" font-weight="400">Explicit --overwrite can replace</text><text x="40" y="610" fill="#a9bbcf" font-size="19" font-weight="400">Destination: data/bronze/{source}/dt=YYYY-MM-DD/    |    Original dirty data stays intact.</text></g></svg>