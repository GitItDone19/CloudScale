<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="645" viewBox="0 0 1200 645" role="img" aria-labelledby="title desc">
<title id="title">CloudScale platform architecture</title><desc id="desc">Generated sources flow into implemented local Bronze. Local Silver processing routes rejected rows to a dead-letter queue; BigQuery and dbt supply analytics and dashboards. Full Airflow orchestration is planned.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#5eead4"/></marker></defs>
<rect width="1200" height="645" rx="22" fill="#0b1220"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="48" fill="#f1f5f9" font-size="24" font-weight="650">THE PLATFORM / TARGET ARCHITECTURE</text><text x="40" y="80" fill="#a9bbcf" font-size="17" font-weight="400">Solid arrows show the data path. Labels distinguish implemented and planned components.</text><rect x="40" y="125" width="250" height="225" rx="16" fill="#142237" stroke="#30445f"/><rect x="60" y="147" width="30" height="4" rx="2" fill="#5eead4"/><text x="60" y="184" fill="#f1f5f9" font-size="23" font-weight="650">Sources</text><text x="60" y="217" fill="#a9bbcf" font-size="17" font-weight="400">Generated CSV + JSON</text><text x="60" y="244" fill="#a9bbcf" font-size="17" font-weight="400">Orders / merchants</text><text x="60" y="271" fill="#a9bbcf" font-size="17" font-weight="400">Warehouse / carriers</text><text x="60" y="331" fill="#5eead4" font-size="14" font-weight="650">IMPLEMENTED LOCALLY</text><rect x="330" y="125" width="250" height="225" rx="16" fill="#142237" stroke="#30445f"/><rect x="350" y="147" width="30" height="4" rx="2" fill="#fbbf77"/><text x="350" y="184" fill="#f1f5f9" font-size="23" font-weight="650">Bronze</text><text x="350" y="217" fill="#a9bbcf" font-size="17" font-weight="400">Original bytes preserved</text><text x="350" y="244" fill="#a9bbcf" font-size="17" font-weight="400">Date-partitioned files</text><text x="350" y="271" fill="#a9bbcf" font-size="17" font-weight="400">Checksums + metadata</text><text x="350" y="331" fill="#fbbf77" font-size="14" font-weight="650">IMPLEMENTED LOCALLY</text><rect x="620" y="125" width="250" height="225" rx="16" fill="#142237" stroke="#30445f"/><rect x="640" y="147" width="30" height="4" rx="2" fill="#7db5ff"/><text x="640" y="184" fill="#f1f5f9" font-size="23" font-weight="650">Silver</text><text x="640" y="217" fill="#a9bbcf" font-size="17" font-weight="400">PySpark validation</text><text x="640" y="244" fill="#a9bbcf" font-size="17" font-weight="400">Event deduplication</text><text x="640" y="271" fill="#a9bbcf" font-size="17" font-weight="400">Clean Snappy Parquet</text><text x="640" y="331" fill="#7db5ff" font-size="14" font-weight="650">IMPLEMENTED LOCALLY</text><rect x="910" y="125" width="250" height="225" rx="16" fill="#142237" stroke="#30445f"/><rect x="930" y="147" width="30" height="4" rx="2" fill="#c4a5ff"/><text x="930" y="184" fill="#f1f5f9" font-size="23" font-weight="650">Gold + marts</text><text x="930" y="217" fill="#a9bbcf" font-size="17" font-weight="400">BigQuery + dbt models</text><text x="930" y="244" fill="#a9bbcf" font-size="17" font-weight="400">Facts and dimensions</text><text x="930" y="271" fill="#a9bbcf" font-size="17" font-weight="400">SLA / margin analytics</text><text x="930" y="331" fill="#c4a5ff" font-size="14" font-weight="650">PLANNED</text><path d="M290,235 L330,235" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><path d="M580,235 L620,235" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><path d="M870,235 L910,235" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="410" width="250" height="150" rx="16" fill="#142237" stroke="#30445f"/><rect x="640" y="432" width="30" height="4" rx="2" fill="#fbbf77"/><text x="640" y="469" fill="#f1f5f9" font-size="23" font-weight="650">Dead-letter queue</text><text x="640" y="502" fill="#a9bbcf" font-size="17" font-weight="400">Rejected rows + reasons</text><text x="640" y="541" fill="#fbbf77" font-size="14" font-weight="650">LOCAL / INVESTIGATE</text><path d="M745,350 L745,410" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><rect x="910" y="410" width="250" height="150" rx="16" fill="#142237" stroke="#30445f"/><rect x="930" y="432" width="30" height="4" rx="2" fill="#c4a5ff"/><text x="930" y="469" fill="#f1f5f9" font-size="23" font-weight="650">BI dashboard</text><text x="930" y="502" fill="#a9bbcf" font-size="17" font-weight="400">Operational decisions</text><text x="930" y="541" fill="#c4a5ff" font-size="14" font-weight="650">PLANNED / LOOKER STUDIO</text><path d="M1035,350 L1035,410" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="410" width="540" height="150" rx="16" fill="#142237" stroke="#30445f"/><rect x="60" y="432" width="30" height="4" rx="2" fill="#5eead4"/><text x="60" y="469" fill="#f1f5f9" font-size="23" font-weight="650">Airflow orchestration</text><text x="60" y="502" fill="#a9bbcf" font-size="17" font-weight="400">Schedule tasks, retry failures, record execution state</text><text x="60" y="541" fill="#5eead4" font-size="14" font-weight="650">DOCKER SETUP EXISTS / FULL PIPELINE PLANNED</text><text x="40" y="610" fill="#a9bbcf" font-size="18" font-weight="400">Local today: filesystem storage. Cloud target: GCS landing + Silver, BigQuery warehouse.</text></g></svg>