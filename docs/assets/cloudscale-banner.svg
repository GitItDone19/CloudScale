<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-labelledby="title desc">
<title id="title">CloudScale: from messy logistics data to trusted analytics</title><desc id="desc">Collection and PySpark refinement work locally; warehouse analytics are planned.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#5eead4"/></marker></defs>
<rect width="1200" height="495" rx="22" fill="#0b1220"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="53" fill="#5eead4" font-size="15" font-weight="650">CLOUDSCALE / DATA ENGINEERING LAB</text><text x="48" y="112" fill="#f1f5f9" font-size="44" font-weight="700">From messy logistics data</text><text x="48" y="165" fill="#f1f5f9" font-size="44" font-weight="700">to trusted analytics.</text><text x="48" y="209" fill="#a9bbcf" font-size="20" font-weight="400">A learning project in ingestion, distributed processing and warehouse design.</text><rect x="48" y="250" width="352" height="172" rx="16" fill="#142237" stroke="#30445f"/><rect x="68" y="272" width="30" height="4" rx="2" fill="#5eead4"/><text x="68" y="309" fill="#f1f5f9" font-size="23" font-weight="650">Collect</text><text x="68" y="342" fill="#a9bbcf" font-size="17" font-weight="400">Orders, warehouse exports</text><text x="68" y="369" fill="#a9bbcf" font-size="17" font-weight="400">and delivery scanner events</text><text x="68" y="403" fill="#5eead4" font-size="14" font-weight="650">LOCAL BRONZE IMPLEMENTED</text><rect x="424" y="250" width="352" height="172" rx="16" fill="#142237" stroke="#30445f"/><rect x="444" y="272" width="30" height="4" rx="2" fill="#7db5ff"/><text x="444" y="309" fill="#f1f5f9" font-size="23" font-weight="650">Refine</text><text x="444" y="342" fill="#a9bbcf" font-size="17" font-weight="400">Validate, deduplicate</text><text x="444" y="369" fill="#a9bbcf" font-size="17" font-weight="400">and quarantine bad records</text><text x="444" y="403" fill="#7db5ff" font-size="14" font-weight="650">LOCAL PYSPARK IMPLEMENTED</text><rect x="800" y="250" width="352" height="172" rx="16" fill="#142237" stroke="#30445f"/><rect x="820" y="272" width="30" height="4" rx="2" fill="#c4a5ff"/><text x="820" y="309" fill="#f1f5f9" font-size="23" font-weight="650">Understand</text><text x="820" y="342" fill="#a9bbcf" font-size="17" font-weight="400">Delivery SLAs, warehouse</text><text x="820" y="369" fill="#a9bbcf" font-size="17" font-weight="400">efficiency and route margins</text><text x="820" y="403" fill="#c4a5ff" font-size="14" font-weight="650">DBT + BIGQUERY / PLANNED</text><text x="48" y="465" fill="#5eead4" font-size="14" font-weight="650">PRESERVE THE SOURCE</text><text x="424" y="465" fill="#7db5ff" font-size="14" font-weight="650">MAKE EVERY RERUN SAFE</text><text x="800" y="465" fill="#c4a5ff" font-size="14" font-weight="650">BUILD EXPLAINABLE PIPELINES</text></g></svg>