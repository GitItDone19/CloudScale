<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc">
<title id="title">Local Docker development design</title><desc id="desc">Project folders are mounted into Airflow and Spark. Airflow webserver and scheduler use PostgreSQL for metadata. Startup is not yet runtime verified.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#5eead4"/></marker></defs>
<rect width="1200" height="655" rx="22" fill="#0b1220"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="48" fill="#f1f5f9" font-size="24" font-weight="650">LOCAL DEVELOPMENT / DOCKER COMPOSE DESIGN</text><text x="40" y="80" fill="#a9bbcf" font-size="17" font-weight="400">Configuration exists. Container startup and healthcheck DAG execution still need runtime validation.</text><rect x="40" y="130" width="320" height="170" rx="16" fill="#142237" stroke="#30445f"/><rect x="60" y="152" width="30" height="4" rx="2" fill="#5eead4"/><text x="60" y="189" fill="#f1f5f9" font-size="23" font-weight="650">Your project files</text><text x="60" y="222" fill="#a9bbcf" font-size="17" font-weight="400">DAGs, ingestion code and data</text><text x="60" y="249" fill="#a9bbcf" font-size="17" font-weight="400">Shared through folder mounts</text><rect x="440" y="130" width="320" height="170" rx="16" fill="#142237" stroke="#30445f"/><rect x="460" y="152" width="30" height="4" rx="2" fill="#7db5ff"/><text x="460" y="189" fill="#f1f5f9" font-size="23" font-weight="650">Airflow webserver</text><text x="460" y="222" fill="#a9bbcf" font-size="17" font-weight="400">Workflow interface</text><text x="460" y="249" fill="#a9bbcf" font-size="17" font-weight="400">localhost:8080</text><rect x="840" y="130" width="320" height="170" rx="16" fill="#142237" stroke="#30445f"/><rect x="860" y="152" width="30" height="4" rx="2" fill="#7db5ff"/><text x="860" y="189" fill="#f1f5f9" font-size="23" font-weight="650">Airflow scheduler</text><text x="860" y="222" fill="#a9bbcf" font-size="17" font-weight="400">Schedules and executes tasks</text><text x="860" y="249" fill="#a9bbcf" font-size="17" font-weight="400">LocalExecutor configuration</text><rect x="440" y="365" width="320" height="170" rx="16" fill="#142237" stroke="#30445f"/><rect x="460" y="387" width="30" height="4" rx="2" fill="#fbbf77"/><text x="460" y="424" fill="#f1f5f9" font-size="23" font-weight="650">PostgreSQL</text><text x="460" y="457" fill="#a9bbcf" font-size="17" font-weight="400">Airflow task state and history</text><text x="460" y="484" fill="#a9bbcf" font-size="17" font-weight="400">Metadata database</text><path d="M600,300 L600,365" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><path d="M1000,300 L1000,337" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><path d="M1000,337 L790,337" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><path d="M790,337 L790,440" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><path d="M790,440 L760,440" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="365" width="320" height="170" rx="16" fill="#142237" stroke="#30445f"/><rect x="60" y="387" width="30" height="4" rx="2" fill="#c4a5ff"/><text x="60" y="424" fill="#f1f5f9" font-size="23" font-weight="650">Spark master + worker</text><text x="60" y="457" fill="#a9bbcf" font-size="17" font-weight="400">Distributed processing services</text><text x="60" y="484" fill="#a9bbcf" font-size="17" font-weight="400">Local Silver jobs available</text><path d="M200,300 L200,365" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M360,210 L440,210" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="40" y="590" fill="#a9bbcf" font-size="18" font-weight="400">Airflow init prepares the metadata database and development user before Airflow services start.</text><text x="40" y="621" fill="#a9bbcf" font-size="17" font-weight="400">Solid arrows: metadata access. Dashed arrows: shared project folders. No full ingestion DAG yet.</text></g></svg>